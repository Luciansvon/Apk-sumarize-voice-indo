name: Build Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make scripts executable
        run: chmod +x download_libs.sh gradlew

      - name: Download sherpa-onnx AAR
        run: ./download_libs.sh

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ | tail -5
          ls $ANDROID_HOME/build-tools/ | tail -5

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --info --no-daemon 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo "=== BUILD FAILED — First 80 lines ==="
            head -80 /tmp/build.log
            echo "=== BUILD FAILED — Error section ==="
            grep -A 20 "FAILURE\|What went wrong\|Task.*FAILED\|error:" /tmp/build.log | head -60
          fi
          exit $EXIT

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/SumarizeVoiceIndo-${GITHUB_SHA::7}.apk"
          ls -lh artifacts/

      - name: Sanitize branch name for tag
        id: branch
        run: |
          SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          echo "safe=$SAFE" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumarizeVoiceIndo-debug-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          name: "Release ${{ github.ref_name }}"

      - name: Create rolling pre-release (on branch push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          tag_name: "latest-${{ steps.branch.outputs.safe }}"
          name: "APK Terbaru"
          body: |
            Build otomatis dari commit `${{ github.sha }}`.

            ## Cara install di HP Android:
            1. Tap file `.apk` di bawah ini
            2. Jika muncul peringatan → tap **"Install anyway"** / **"Tetap install"**
            3. Aktifkan **"Install from Unknown Sources"** jika diminta → Install
            4. Buka app → download model AI ~604MB via WiFi (sekali saja)
            5. Setelah itu **100% offline selamanya** ✅
          prerelease: true
          make_latest: true
