name: Build Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make scripts executable
        run: chmod +x download_libs.sh gradlew

      - name: Download sherpa-onnx AAR
        run: ./download_libs.sh

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/SumarizeVoiceIndo-${GITHUB_SHA::7}.apk"
          ls -lh artifacts/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumarizeVoiceIndo-debug-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          name: "Release ${{ github.ref_name }}"

      - name: Create rolling pre-release (on branch push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          tag_name: "build-${{ github.ref_name }}-latest"
          name: "Latest Build (${{ github.ref_name }})"
          body: |
            Otomatis dibuild dari commit `${{ github.sha }}`.

            **Cara install di HP:**
            1. Download file `.apk` di bawah
            2. Buka file → izinkan "Install from Unknown Sources"
            3. Tap Install

            Saat pertama buka app, akan download model AI ~604MB (sekali aja, lalu offline selamanya).
          prerelease: true
          make_latest: false
