name: Build Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make scripts executable
        run: chmod +x download_libs.sh gradlew

      - name: Download sherpa-onnx AAR
        run: ./download_libs.sh

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: |
          # GitHub Actions uses bash -eo pipefail by default.
          # Using || { } so the diagnostic block runs even when gradle fails.
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --no-build-cache 2>&1 | tee /tmp/build.log || {
            echo ""
            echo "=== KOTLIN COMPILER ERRORS (e: lines) ==="
            grep "^e: " /tmp/build.log || echo "(no e: lines found)"
            echo ""
            echo "=== KSP / ROOM / ANNOTATION ERRORS ==="
            grep -iE "error:|ksp|schema|annotation|unresolved" /tmp/build.log \
              | grep -v "^>" | head -40 || echo "(none found)"
            echo ""
            echo "=== LAST 60 LINES OF BUILD LOG ==="
            tail -60 /tmp/build.log
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/SumarizeVoiceIndo-${GITHUB_SHA::7}.apk"
          ls -lh artifacts/

      - name: Sanitize branch name for tag
        id: branch
        run: |
          SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          echo "safe=$SAFE" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumarizeVoiceIndo-debug-${{ github.sha }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          name: "Release ${{ github.ref_name }}"

      - name: Create rolling pre-release (on branch push)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          tag_name: "latest-${{ steps.branch.outputs.safe }}"
          name: "APK Terbaru"
          body: |
            Build otomatis dari commit `${{ github.sha }}`.

            ## Cara install di HP Android:
            1. Tap file `.apk` di bawah ini
            2. Jika muncul peringatan → tap **"Install anyway"** / **"Tetap install"**
            3. Aktifkan **"Install from Unknown Sources"** jika diminta → Install
            4. Buka app → download model AI ~604MB via WiFi (sekali saja)
            5. Setelah itu **100% offline selamanya** ✅
          prerelease: true
          make_latest: true
